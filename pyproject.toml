[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "photo-organizer"
version = "0.2.0a3"
description = "Local photo organization engine, agent skill, CLI and MCP tools"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["Pillow>=11,<14", "jsonschema>=4.23,<5"]
[project.optional-dependencies]
mcp = ["mcp>=1.26,<2"]
dev = ["build>=1.2,<2", "ruff>=0.14,<1"]

[project.scripts]
photo-organizer = "photo_organizer.interfaces.cli:main"
photo-organizer-mcp = "photo_organizer.interfaces.mcp_server:main"
[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.data-files]
"share/photo-organizer/skills/photo-organizer" = ["skills/photo-organizer/SKILL.md"]
"share/photo-organizer/skills/photo-organizer/references" = ["skills/photo-organizer/references/tools.md"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
